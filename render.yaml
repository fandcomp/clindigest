services:
  - type: web
    name: clindigest-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TRANSPORT
        value: http
      - key: PORT
        value: "3000"
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in Render dashboard
    healthCheckPath: /health
